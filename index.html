<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabari - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body{font-family:'Poppins', sans-serif;}
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 250px;
            height: 100px;
            background: #1e5aa8;
            border-top-right-radius: 100% 100%;
        }
    </style>
</head>
<body class="bg-[#e9eef5] flex justify-center p-2 md:p-6">

    <!-- Main Card like in picture -->
    <div class="w-full max-w-[1100px] bg-[#0c3b6f] rounded-xl overflow-hidden relative shadow-2xl min-h-[600px] flex flex-col">

        <!-- Navbar -->
        <nav class="flex justify-between items-center px-6 md:px-10 py-6 text-white relative z-10">
            <h1 class="font-bold text-lg">Kabari</h1>
            <!-- Desktop Menu -->
            <ul class="hidden md:flex gap-8 text-[13px] font-light">
                <li class="border-b-2 border-white pb-1 text-[#38bdf8]"><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Skills</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <!-- Mobile Menu Icon -->
            <button class="md:hidden text-white text-xl">☰</button>
        </nav>

        <!-- Hero Content -->
        <div class="flex-1 flex flex-col-reverse md:flex-row items-center px-6 md:px-16 py-10 md:py-16 gap-10 relative z-10">
            
            <!-- Left Text -->
            <div class="flex-1 text-white text-center md:text-left">
                <h2 class="text-2xl font-semibold">Hello, I'm</h2>
                <h1 class="text-5xl md:text-6xl font-extrabold text-[#22d3ee] mt-1">IKPOR</h1>
                <p class="text-[13px] md:text-[14px] leading-relaxed mt-4 font-light opacity-90 max-w-[380px] mx-auto md:mx-0">
                    I'm a dedicated and enthusiastic learner with a strong interest in technology, design, and creative building. Driven by continuous growth and open to new opportunities.
                <button class="mt-6 bg-[#00c2ff] hover:bg-[#00b0e6] text-white text-[13px] px-7 py-2.5 rounded-full font-medium transition">
                    Contact Me
                </button>
            </div>

            <!-- Right Image -->
            <div class="flex-1 flex justify-center md:justify-end">
                <div class="w-[260px] md:w-[340px] h-[320px] md:h-[380px] bg-[#d6dbe3] rounded-xl overflow-hidden shadow-lg">
                    <img src="profile.webp" alt="Kabari" class="w-full h-full object-cover object-top">
                </div>
            </div>
        </div>

        <!-- Bottom Curve Decoration -->
        <div class="wave hidden md:block"></div>
    </div>

</body>
</html>
